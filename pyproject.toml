[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aap-eda"
version = "0.2.0"
description = ""
readme = "README.md"
authors = [
    { name = "Ansible, Inc.", email = "Red Hat, Inc. <info@ansible.com>" },
]
requires-python = ">=3.11,<3.13"

[project.scripts]
aap-eda-manage = 'aap_eda.manage:main'


# -------------------------------------
# Poetry: Metadata
# -------------------------------------
[tool.poetry]
requires-poetry = ">=2.0,<3.0"
packages = [{ include = "aap_eda", from = "src" }]
include = ["aap_eda/data/playbooks/*.yml"]


# -------------------------------------
# Poetry: Dependencies
# -------------------------------------
[tool.poetry.extras]
all = ["psycopg"]
dev = ["psycopg-binary"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
django = ">=5.2,<5.3"
djangorestframework = "3.15.*"
drf-spectacular = ">=0.28,<0.30"
channels = { version = "4.3.*", extras = ["daphne"] }
daphne = ">=4.2.2"
psycopg-binary = { version = "*", optional = true }
django-filter = ">=25.1,<26"
pydantic = ">=1.8.1,<1.11"
cryptography = ">=50.0.0,<51"
pyopenssl = ">=26.0.0"
dynaconf = ">=3.2.13"
kubernetes = "26.1.*"
podman = "5.4.*"
django-ansible-base = { git = "https://github.com/ansible/django-ansible-base.git", rev = "77dc77e8ecdf466a76e3dfc1d20239824d5af337", extras = [
    "channel-auth",
    "rbac",
    "resource-registry",
    "jwt-consumer",
    "rest-filters",
    "feature-flags",
] }
# social auth for DAB authenticators (OIDC/Keycloak/GitHub/Azure/Google);
# deliberately not the DAB "authentication" extra, which drags in ldap/saml/xmlsec
# and their system libs
social-auth-app-django = "5.4.1"
social-auth-core = "<=4.5.4"
jinja2 = ">=3.1.5,<3.2"
pexpect = "^4.9.0"
ansible-runner = ">=2.4"
python-gnupg = "^0.5.2"
# indirectly needed by twisted, this version avoids issues with newer versions of setuptools:
# https://github.com/crossbario/autobahn-python/pull/1632
autobahn = ">=24.4.2"
psycopg = "^3.1.17"
xxhash = "3.4.*"
pyjwt = { version = ">=2.13.0,<3", extras = ["crypto"] }
validators = "^0.34.0"
django-flags = "^5.0.13"
insights-analytics-collector = "^0.3.2"
distro = "^1.9.0"
dispatcherd = { version = "v2026.05.27", extras = ["pg_notify"] }
urllib3 = ">=2.6.3"
awx-plugins-core = { version = "^0.0.1a10", extras = [
                              "credentials-aim",
                              "credentials-aws-secretsmanager-credential",
                              "credentials-azure-kv",
                              "credentials-centrify-vault-kv",
                              "credentials-conjur",
                              "credentials-github-app",
                              "credentials-hashivault-kv",
                              "credentials-hashivault-ssh",
                              "credentials-thycotic-dsv",
                              "credentials-thycotic-tss"
                    ]}
pyasn1 = ">=0.6.4"
# limit setuptools to avoid the pkg_resources removal
setuptools = "<84"


[tool.poetry.group.test.dependencies]
# <9 pinned deliberately: pytest 9's internals break pytest-lazy-fixtures'
# pytest_generate_tests hook (GHSA-6w46-j5rx-g56g needs >=9.0.3, no plugin
# supports it yet) - bump once the plugin catches up
pytest = "<9"
pytest-env = "*"
pytest-django = "*"
pytest-asyncio = "*"
requests = { version = "*", python = "<4.0" }
pytest-cov = "^4.1.0"
pytest-lazy-fixtures = "^1.4.1"
requests-mock = "*"
httpie = "^3.2.3"
freezegun = "^1.1.0"

[tool.poetry.group.lint.dependencies]
flake8 = "*"
isort = "*"
# <24 pinned deliberately: 24.x reformats ~30 files, do that as its own PR
black = "<24"
flake8-broken-line = { version = "*", python = "<4.0" }
flake8-string-format = "*"
# This is an experimental linter.
ruff = "*"
# The rull claims that the flake8 plugins listed below are re-implemented,
#   These plugins will remain included until it's verified.
pep8-naming = "*"
flake8-bugbear = "*"
flake8-comprehensions = "*"
flake8-debugger = "*"
flake8-docstrings = "*"
flake8-eradicate = { version = "*", python = "<4.0" }
flake8-print = "*"

[tool.poetry.group.dev.dependencies]
ipython = "*"

# -------------------------------------
# Tools
# -------------------------------------

[tool.black]
line-length = 79
target-version = ["py39", "py310"]

[tool.isort]
profile = "black"
combine_as_imports = true
line_length = 79

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",
    "F",
    "D",   # flake8-docstrings
    "TID", # flake8-tidy-imports
]
extend-ignore = [
    "D1", #  Missing docstrings errors
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/aap_eda/core/migrations/*" = ["E501"]
"tests/**/*.py" = [
    "S101",   # Asserts allowed in tests
    "ARG",    # Fixtures are not always used explicitly
    "SLF001", # Call private methods in tests
    "D",      # Docstrings are not required in tests
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "pep257"
